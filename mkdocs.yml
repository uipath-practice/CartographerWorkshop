site_name: UiPath Cartographer Tech Workshop
site_url: https://uipath-practice.github.io/CartographerWorkshop/
site_description: Hands-on learner's handbook for designing processes with UiPath Cartographer and taking them from discovery to production
site_author: Diana Mincu

theme:
  name: material
  logo: assets/images/Partner Success Logo.png
  favicon: assets/images/favicon.png
  font:
    text: Inter
  palette:
    scheme: default
    primary: deep orange
    accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

hooks:
  - hooks/split_cols.py

# main.py provides environment variables (training_url, training_tenant, env_label)
# driven by the COURSE_ENV env var (staging | prod). See main.py.
plugins:
  - search
  - macros:
      module_name: main

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# Published navigation only. Work-in-progress pages live in mkdocs.local.yml.
nav:
  - Home: index.md
  - Warranty Resolution at Cobalt Ridge:
      - Overview: warranty-resolution/index.md
      - How Cartographer works: warranty-resolution/how-cartographer-works.md
      - About Cobalt Ridge Automation: warranty-resolution/about-cobalt-ridge.md
      - Prerequisites: warranty-resolution/prerequisites.md
      - Set up the project: warranty-resolution/set-up-project.md
      - Capture and review the AS-IS: warranty-resolution/capture-as-is.md
      - Design the future state: warranty-resolution/design-future-state.md
      - Make live edits: warranty-resolution/live-edits.md
      - Generate the PDD: warranty-resolution/generate-pdd.md
      - "Optional: ask a teammate": warranty-resolution/ask-a-teammate.md
  - From Process to Production:
      - Overview: process-to-production/index.md
      - The PDD isn't the end of the story: process-to-production/the-journey.md
      - Design the solution: process-to-production/design-the-solution.md
      - Build it with a coding agent: process-to-production/build-with-a-coding-agent.md
      - Review, publish and run it: process-to-production/review-publish-run.md
      - Close the loop: process-to-production/close-the-loop.md
  - Next Steps: next-steps.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  generator: false
